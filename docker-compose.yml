version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: dignity_postgres
    environment:
      POSTGRES_USER: dignity_admin
      POSTGRES_PASSWORD: dignity_pass
      POSTGRES_DB: dignity_watch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dignity_admin -d dignity_watch"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: dignity_neo4j
    environment:
      NEO4J_AUTH: neo4j/dignity_pass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    container_name: dignity_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data: